<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for 3D text effect -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow gradient -->
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#888888;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#666666;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Green dot gradient -->
    <radialGradient id="dotGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#7FFF00;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00FF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CC00;stop-opacity:1" />
    </radialGradient>
    
    <!-- Filter for depth -->
    <filter id="depth" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background shadow layers for depth -->
  <text x="20" y="40" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#999999" opacity="0.3">
    resume
  </text>
  <text x="20.5" y="40.5" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#aaaaaa" opacity="0.4">
    resume
  </text>
  <text x="21" y="41" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#bbbbbb" opacity="0.5">
    resume
  </text>
  
  <!-- Main text with gradient -->
  <text x="22" y="42" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGradient)" filter="url(#depth)">
    resume
  </text>
  
  <!-- Highlight on top of text for 3D effect -->
  <text x="22" y="42" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" opacity="0.4">
    resume
  </text>
  
  <!-- Shadow for green dot -->
  <circle cx="177" cy="37" r="5.5" fill="#006600" opacity="0.4"/>
  
  <!-- 3D Green dot with gradient -->
  <circle cx="176" cy="35" r="5.5" fill="url(#dotGradient)"/>
  
  <!-- Highlight on dot for glossy effect -->
  <circle cx="174.5" cy="33" r="2" fill="white" opacity="0.6"/>
</svg>